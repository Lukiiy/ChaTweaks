[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "Lukiiy"
name = "ChaTweaks"
description = "A cool little mod that adds some features to the chat, as well as tweaking others!"
websiteUrl = "https://github.com/Lukiiy/ChaTweaks/"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/ChaTweaks/release/ChaTweaks.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
communities = [ "super-battle-golf", ] # https://thunderstore.io/api/experimental/community/

[publish.categories]
super-battle-golf = [ "mods", "qol", "clientside" ] # https://thunderstore.io/api/experimental/community/super-battle-golf/category/
